name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Test Dependabot merge rules
        run: ruby .github/scripts/dependabot-auto-merge-test.rb

      - run: npm ci
      - run: npm run test:server
      - name: Build server image
        run: docker build --file server/Dockerfile --tag bbnote-server-ci .

  web-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run test:web
      - name: Build web image
        run: docker build --file web/Dockerfile --tag bbnote-web-ci .

  e2e-test:
    runs-on: ubuntu-latest
    needs:
      - server-test
      - web-test

    steps:
      - uses: actions/checkout@v7

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Start split stack
        run: docker compose --project-name bbnote-ci -f docker-compose.ci.yml up -d --build server web

      - name: Build Playwright runner
        run: docker compose --project-name bbnote-ci -f docker-compose.ci.yml build e2e

      - name: Wait for split stack
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose --project-name bbnote-ci -f docker-compose.ci.yml run --rm --no-deps e2e node -e "fetch('http://web/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name bbnote-ci -f docker-compose.ci.yml logs
          exit 1

      - name: Run Playwright against split stack
        run: docker compose --project-name bbnote-ci -f docker-compose.ci.yml run --rm --no-deps e2e

      - name: Build all-in-one image
        run: docker build --file Dockerfile.all-in-one --tag bbnote-all-in-one-ci .

      - name: Stop split stack
        if: always()
        run: docker compose --project-name bbnote-ci -f docker-compose.ci.yml down -v

  publish-images:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - server-test
      - web-test
      - e2e-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bbnote-web
            dockerfile: web/Dockerfile
          - image: bbnote-server
            dockerfile: server/Dockerfile
          - image: bbnote
            dockerfile: Dockerfile.all-in-one

    steps:
      - uses: actions/checkout@v7

      - id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
